name: Automated OSINT Daily Update

on:
  schedule:
    # Run once daily at 8 AM UTC (09:00 local time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Preflight workflow configuration
        id: preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
          QUALITY_BASE_URL: ${{ vars.QUALITY_BASE_URL }}
          QUALITY_PUBLICATION_MODE: shadow
        run: npm run workflow:preflight

      - name: Verify trust storage readiness
        id: trust_readiness
        if: steps.preflight.outcome == 'success'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run trust:readiness -- --compact > quality-reports/trust-readiness.json

      - name: Run Metadata Automation
        id: metadata
        if: steps.preflight.outputs.foundry_available == 'true'
        continue-on-error: true
        env:
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
        run: npx tsx scripts/automate-daily-metadata.ts

      - name: Report skipped metadata enrichment
        if: steps.preflight.outputs.foundry_available != 'true'
        run: echo "Foundry metadata enrichment skipped; trust ingestion will continue."

      - name: Refresh legacy KPI metadata
        id: kpis
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npx tsx scripts/update-kpis.ts

      - name: Run intelligence, blog, and commodity shadow ingestion
        id: shadow_ingestion
        if: always() && steps.preflight.outcome == 'success' && steps.trust_readiness.outcome == 'success'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
        run: npx tsx scripts/advanced-scrape.ts --output quality-reports/shadow-ingestion-report.json

      - name: Refresh legacy scores and report trusted readiness
        id: score_refresh
        if: always() && steps.preflight.outcome == 'success' && steps.trust_readiness.outcome == 'success'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/update-countries.ts --readiness-output quality-reports/score-readiness-report.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('quality-reports/score-readiness-report.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'trusted_status='+r.promotion.status+'\n');"

      - name: Verify deterministic data quality
        id: data_quality
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: npm run data-quality -- --output quality-reports/workflow-data-quality-report.json

      - name: Verify live post-write data quality
        id: live_quality
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          QUALITY_BASE_URL: ${{ vars.QUALITY_BASE_URL || 'https://axis-mocha.vercel.app' }}
          QUALITY_PUBLICATION_MODE: shadow
        run: npm run data-quality:live

      - name: Publish workflow summary
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SHADOW_INGESTION_OUTCOME: ${{ steps.shadow_ingestion.outcome }}
          SCORE_REFRESH_OUTCOME: ${{ steps.score_refresh.outcome }}
          DATA_QUALITY_OUTCOME: ${{ steps.data_quality.outcome }}
          LIVE_QUALITY_OUTCOME: ${{ steps.live_quality.outcome }}
          SCORE_PROMOTION_STATUS: ${{ steps.score_refresh.outputs.trusted_status }}
          FOUNDRY_STATUS: ${{ steps.preflight.outputs.foundry_status }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          COMMODITY_HISTORY_STATUS: ${{ steps.shadow_ingestion.outputs.commodity_history_status }}
          COMMODITY_HISTORY_BOOTSTRAP: ${{ steps.shadow_ingestion.outputs.commodity_history_bootstrap }}
          COMMODITY_HISTORY_UNAVAILABLE: ${{ steps.shadow_ingestion.outputs.commodity_history_unavailable }}
          COMMODITY_HISTORY_LOADED_COUNT: ${{ steps.shadow_ingestion.outputs.commodity_history_loaded_count }}
          COMMODITY_HISTORY_LATEST_SOURCE_PUBLISHED_AT: ${{ steps.shadow_ingestion.outputs.commodity_history_latest_source_published_at }}
          COMMODITY_HISTORY_LATEST_PUBLISHED_AT: ${{ steps.shadow_ingestion.outputs.commodity_history_latest_published_at }}
        run: npm run workflow:summary

      - name: Upload workflow safety and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-safety-reports
          path: |
            quality-reports/workflow-preflight.json
            quality-reports/trust-readiness.json
            quality-reports/workflow-data-quality-report.json
            quality-reports/workflow-summary.json
            quality-reports/shadow-ingestion-report.json
            quality-reports/score-readiness-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce required workflow outcomes
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          TRUST_READINESS_OUTCOME: ${{ steps.trust_readiness.outcome }}
          SHADOW_INGESTION_OUTCOME: ${{ steps.shadow_ingestion.outcome }}
          SCORE_REFRESH_OUTCOME: ${{ steps.score_refresh.outcome }}
          DATA_QUALITY_OUTCOME: ${{ steps.data_quality.outcome }}
          LIVE_QUALITY_OUTCOME: ${{ steps.live_quality.outcome }}
        run: |
          for outcome in \
            "$PREFLIGHT_OUTCOME" \
            "$TRUST_READINESS_OUTCOME" \
            "$SHADOW_INGESTION_OUTCOME" \
            "$SCORE_REFRESH_OUTCOME" \
            "$DATA_QUALITY_OUTCOME" \
            "$LIVE_QUALITY_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
             echo "Required workflow outcome failed or was skipped: $outcome"
             exit 1
            fi
          done

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily dashboard metadata update [skip ci]"
          branch: main
